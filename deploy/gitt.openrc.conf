# Install as /etc/conf.d/gitt. Use an existing repository owner, or create
# the gitt user and git group before starting the service.
gitt_user="gitt:git"
gitt_root="/srv/git"
gitt_bind="127.0.0.1:8080"
# Values here become command arguments; use a repository path without shell spaces
# for this service example. Configure the hostname explicitly when using a proxy.
gitt_args="--origin http://127.0.0.1:8080 --ssh-prefix ssh://git@example.test/srv/git/"
