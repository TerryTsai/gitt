name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      CARGO_TERM_COLOR: always
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "${{ matrix.target }}"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Check formatting and scripts
        run: |
          cargo fmt --all -- --check
          for script in install.sh scripts/build-release.sh scripts/package-release.sh; do
            sh -n "$script"
          done
      - name: Build standalone executable
        run: sh scripts/build-release.sh "${{ matrix.target }}"
      - name: Check startup and HTTP response
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/gitt"
          "$binary" --version
          mkdir -p "$RUNNER_TEMP/repositories"
          "$binary" "$RUNNER_TEMP/repositories" --bind 127.0.0.1:18080 > "$RUNNER_TEMP/gitt.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ -o "$RUNNER_TEMP/index.html"; then
              grep -q 'No repositories found' "$RUNNER_TEMP/index.html"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/gitt.log"
          exit 1
      - name: Package and check installer
        run: |
          sh scripts/package-release.sh "${{ matrix.target }}"
          python3 tests/install.py --archive "dist/gitt-linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gitt-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: gitt-linux-*
          merge-multiple: true
          path: dist
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Standalone Linux binaries for x86-64 and ARM64, built and checked by GitHub Actions.

          Install the latest release:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/TerryTsai/gitt/main/install.sh | sh
          ```

          Requires Linux 6.2+ with Landlock enabled. The installer checks SHA-256 hashes and installs to `~/.local/bin`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "gitt $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
