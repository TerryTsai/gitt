<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ title }} · gitt</title>
<link rel="stylesheet" href="{{ stylesheet }}">
</head>
<body>
<header>
<nav aria-label="Breadcrumb">
{{ breadcrumbs|safe }}
</nav>
<nav aria-label="Page actions">{{ actions|safe }}{% if show_create %}<a href="/new">Create</a>{% endif %}<a href="{{ search_url }}">Search</a></nav>
{% if !tabs.is_empty() %}
<div aria-label="Repository toolbar">
<nav aria-label="Repository">
{% for tab in tabs %}<a href="{{ tab.href }}"{% if tab.active %} aria-current="page"{% endif %}>{{ tab.label }}</a>{% endfor %}
</nav>
<p aria-label="Current revision">{{ context|safe }}</p>
</div>
{% endif %}
</header>
<main>
{% if show_heading %}<h1>{{ heading|safe }}</h1>{% endif %}
{{ body|safe }}
</main>
</body>
</html>
